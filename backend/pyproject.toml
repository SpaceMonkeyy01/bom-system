[project]
name = "bom-backend"
version = "0.1.0"
description = "BOM System backend: templates, formula engine, materials, BOMs"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic-settings>=2.3",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
  "argon2-cffi>=23",
  "email-validator>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
